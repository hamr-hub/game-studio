[package]
name = "cocos_studio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
cocos4-rust = { path = "../../cocos4-rust" }
ndk = { version = "0.7", features = ["asset"] }
ndk-glue = "0.7"
ndk-sys = "0.4"
zip = "0.6"
raw-window-handle = "0.5"
android_logger = "0.13"
log = "0.4"

[features]
default = []
