name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-release-apk:
    name: Build release APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cocos4-rust dependency
        uses: actions/checkout@v4
        with:
          repository: Dave-he/cocos4-rust
          path: cocos4-rust

      - name: Link cocos4-rust for native build
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.."
          ln -sfn "${GITHUB_WORKSPACE}/cocos4-rust" "${GITHUB_WORKSPACE}/../cocos4-rust"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Prepare local Android properties
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build release APK
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" app:assembleRelease -PtargetAbi=${{ matrix.abi }} -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-studio-release-${{ matrix.abi }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
