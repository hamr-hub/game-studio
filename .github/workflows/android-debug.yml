name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    name: Build debug APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cocos4-rust dependency
        uses: actions/checkout@v4
        with:
          repository: Dave-he/cocos4-rust
          ref: 19d05d96359978d1bbdf81157e9573124cb47aa3
          path: cocos4-rust

      - name: Link cocos4-rust for native build
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.."
          ln -sfn "${GITHUB_WORKSPACE}/cocos4-rust" "${GITHUB_WORKSPACE}/../cocos4-rust"

      - name: Prepare Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi i686-linux-android

      - name: Prepare Android toolchain for cargo
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/$(ls -1 "${ANDROID_HOME}/ndk" | sort -V | tail -n 1)"
          TOOLCHAIN_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "${TOOLCHAIN_BIN}"
          echo "${TOOLCHAIN_BIN}" >> "${GITHUB_PATH}"

          case "${{ matrix.abi }}" in
            arm64-v8a)
              TARGET_TRIPLE="aarch64-linux-android"
              ;;
            x86_64)
              TARGET_TRIPLE="x86_64-linux-android"
              ;;
            armeabi-v7a)
              TARGET_TRIPLE="armv7a-linux-androideabi"
              ;;
            x86)
              TARGET_TRIPLE="i686-linux-android"
              ;;
            *)
              echo "Unsupported ABI: ${{ matrix.abi }}" >&2
              exit 1
              ;;
          esac

          TARGET_LINKER=""
          TARGET_LINKER_CPP=""

          make_tool_link() {
            local triple="$1"
            local tool="$2"
            local direct_tool="${TOOLCHAIN_BIN}/${triple}-${tool}"
            local candidate

            if [ -x "${TOOLCHAIN_BIN}/${triple}33-${tool}" ]; then
              candidate="${TOOLCHAIN_BIN}/${triple}33-${tool}"
            elif [ -x "${TOOLCHAIN_BIN}/${triple}21-${tool}" ]; then
              candidate="${TOOLCHAIN_BIN}/${triple}21-${tool}"
            else
              candidate=$(find "${TOOLCHAIN_BIN}" -maxdepth 1 -type f -name "${triple}*-${tool}" -executable 2>/dev/null | sort -V | tail -n 1)
            fi

            if [ -z "${candidate}" ] || [ ! -x "${candidate}" ]; then
              echo "Missing Android toolchain for ${triple}-${tool}" >&2
              exit 1
            fi

            ln -sf "${candidate}" "${direct_tool}"
            if [ "${triple}" = "${TARGET_TRIPLE}" ]; then
              echo "${candidate}"
            else
              echo ""
            fi
          }

          for triple in aarch64-linux-android x86_64-linux-android armv7a-linux-androideabi i686-linux-android; do
            clang_path=$(make_tool_link "$triple" "clang")
            clangpp_path=$(make_tool_link "$triple" "clang++")
            if [ "${triple}" = "${TARGET_TRIPLE}" ]; then
              TARGET_LINKER="${clang_path}"
              TARGET_LINKER_CPP="${clangpp_path}"
            fi
          done

          if [ -z "${TARGET_LINKER}" ] || [ -z "${TARGET_LINKER_CPP}" ]; then
            echo "Missing Android toolchain linker for ${TARGET_TRIPLE}" >&2
            exit 1
          fi

          TARGET_ENV="${TARGET_TRIPLE//-/_}"
          TARGET_ENV="${TARGET_ENV^^}"
          echo "CC=${TARGET_LINKER}" >> "${GITHUB_ENV}"
          echo "CXX=${TARGET_LINKER_CPP}" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_${TARGET_ENV}_LINKER=${TARGET_LINKER}" >> "${GITHUB_ENV}"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Prepare local Android properties
        run: |
          ./scripts/bootstrap_gradle.sh
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build debug APK
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" app:assembleDebug -PtargetAbi=${{ matrix.abi }} -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-studio-debug-${{ matrix.abi }}-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
