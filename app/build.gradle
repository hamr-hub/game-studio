apply plugin: 'com.android.application'

android {
    namespace "com.cocos.gamestudio"
    compileSdk 35
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.cocos.gamestudio"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def targetAbi = project.findProperty("targetAbi")?.toString()
        if (targetAbi) {
            ndk {
                abiFilters targetAbi
            }
        } else {
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["${buildDir}/rust-libs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(21)
        targetCompatibility JavaVersion.toVersion(21)
    }
}

def targetAbi = (project.findProperty("targetAbi") ?: "arm64-v8a").toString()
def supportedRustTargets = [
    "arm64-v8a": "aarch64-linux-android",
    "x86_64": "x86_64-linux-android",
    "armeabi-v7a": "armv7-linux-androideabi",
    "x86": "i686-linux-android",
]
def rustTarget = supportedRustTargets.getOrDefault(targetAbi, "aarch64-linux-android")
def nativeCargoDir = file("${projectDir}/../native")
def rustTargetDir = file("${nativeCargoDir}/target")
def stagedRustLibDir = file("${buildDir}/rust-libs/${targetAbi}")
def rustLibName = "libcocos_studio.so"
def nativeLibPath = file("${rustTargetDir}/${rustTarget}/release/${rustLibName}")

def prepareRustLibTask = tasks.register("prepareRustLib") {
    group = "build"
    description = "Builds cocos_studio Rust library and stages it into AGP jniLibs directory for packaging."

    outputs.dir(stagedRustLibDir)
    inputs.property("targetAbi", targetAbi)
    inputs.property("rustTarget", rustTarget)

    doLast {
        if (!supportedRustTargets.containsKey(targetAbi)) {
            throw new GradleException("Unsupported targetAbi '${targetAbi}'. Supported: ${supportedRustTargets.keySet()}")
        }

        exec {
            workingDir nativeCargoDir
            commandLine "cargo", "build", "--manifest-path", "${nativeCargoDir}/Cargo.toml", "--target", rustTarget, "--release"
        }

        if (!nativeLibPath.exists()) {
            throw new GradleException("Rust build finished but ${nativeLibPath} was not generated.")
        }

        copy {
            from(nativeLibPath)
            into(stagedRustLibDir)
        }
    }
}

tasks.matching { task ->
    task.name in ["mergeDebugJniLibFolders", "mergeReleaseJniLibFolders", "mergeDebugNativeLibs", "mergeReleaseNativeLibs"]
}.configureEach {
    dependsOn(prepareRustLibTask)
    inputs.dir(stagedRustLibDir)
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
